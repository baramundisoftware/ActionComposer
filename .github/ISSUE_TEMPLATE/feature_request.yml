name: Feature request
description: Suggest something Action Composer should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Action Composer is a community project, so a request may wait or may not be taken up.

        **Do not paste secrets.** Remove API keys, passwords, tokens, server names, host names, IP addresses and user names from everything you write or attach.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or the problem, before the solution. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
      description: How you imagine it working, in your own words.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: A workaround, another tool, or doing it by hand in the baramundi console.
  - type: checkboxes
    id: clean
    attributes:
      label: Nothing private is included
      options:
        - label: I removed passwords, API keys, tokens, server names, host names, IP addresses and user names from this request and from everything I attached.
          required: true
